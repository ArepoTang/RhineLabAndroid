name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell
        uses: actions/checkout@v5

      # 我们自己的 fork：日历/笔记与全部改动都在这里，不再是上游的壁纸构建。
      - name: Checkout web source
        uses: actions/checkout@v5
        with:
          repository: ArepoTang/RhineLabUI
          ref: main
          path: web

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        env:
          # 用用户 2026-10-17 的授权把 Novecento 打进 APK（从正式站点取回并校验哈希）
          RHINE_NOVECENTO_BUNDLE: '1'
        run: |
          npm ci
          npm run check:entries
          npm run build
          test -f dist/fonts/novecento/webFonts/NovecentoSansWideNormal/font.woff2
          test -f dist/fonts/novecento/webFonts/NovecentoSansWideBold/font.woff2

      - name: Stage assets
        run: |
          chmod +x scripts/prepare-web.sh
          ./scripts/prepare-web.sh web/dist

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 SIGNING_KEYSTORE_BASE64，release 包会没有签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rhine-lab.p12"
          test -s "$RUNNER_TEMP/rhine-lab.p12"
          {
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/rhine-lab.p12"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Inspect APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          echo "--- top level ---"
          unzip -l "$APK" | head -25
          echo "--- counts ---"
          for p in assets/www/index.html assets/www/assets assets/www/fonts classes.dex; do
            echo "$p: $(unzip -l "$APK" | grep -c "$p")"
          done
          BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)")
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|uses-permission" | head -5
          echo "--- manifest ---"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | head -70
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs -v "$APK" | grep -E "certificate DN|certificate SHA-256 digest|Verified using" | head -12
          echo "--- expected identity ---"
          # 指纹行的写法随 build-tools 版本变过：老版是 "Signer #1 certificate SHA-256 digest: ab:cd"，
          # 新版是 "V2 Signer: certificate SHA-256 digest: abcd"。统一成小写无冒号再比。
          FPR=$("$BT/apksigner" verify --print-certs -v "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-Z' 'a-z')
          EXPECTED=341a5cd9ebd1f882ad367bc9c88d3ada0e5ce1d9fc52f2a80f470a15b5f0b76a
          if [ "$FPR" != "$EXPECTED" ]; then
            echo "::error::签名证书不是预期的那一份（实际 $FPR）"
            exit 1
          fi
          "$BT/aapt2" dump badging "$APK" | grep -q "package: name='com.rhine.lab'" || { echo "::error::包名不是 com.rhine.lab"; exit 1; }
          echo "package com.rhine.lab · certificate $FPR"

      - uses: actions/upload-artifact@v6
        with:
          name: rhinelab-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # A stable URL that a GitHub proxy can fetch from China:
      #   https://github.com/ArepoTang/RhineLabAndroid/releases/download/latest/RhineLab-latest.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk RhineLab-latest.apk
          sha256sum RhineLab-latest.apk > RhineLab-latest.apk.sha256
          cat RhineLab-latest.apk.sha256
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Rhine Lab 终端（自动构建）" --notes "每次推送 main 覆盖更新。"
          gh release upload latest RhineLab-latest.apk RhineLab-latest.apk.sha256 --clobber
          gh release edit latest --notes "commit ${{ github.sha }} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
