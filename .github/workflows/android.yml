name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shell
        uses: actions/checkout@v5

      - name: Checkout wallpaper source
        uses: actions/checkout@v5
        with:
          repository: LBEILC/RhineLabWallpaper
          ref: main
          path: rlw

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rlw/package-lock.json

      - name: Build web bundle
        working-directory: rlw
        run: |
          npm ci
          npm run build:wallpaper

      - name: Stage assets
        run: |
          chmod +x scripts/prepare-web.sh
          ./scripts/prepare-web.sh rlw/release/wallpaper

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Inspect APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          echo "--- top level ---"
          unzip -l "$APK" | head -25
          echo "--- counts ---"
          for p in assets/www/index.html assets/www/assets assets/www/fonts classes.dex; do
            echo "$p: $(unzip -l "$APK" | grep -c "$p")"
          done
          BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)")
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | head -25
          echo "--- manifest ---"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | head -70
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs -v "$APK" | head -20

      - uses: actions/upload-artifact@v6
        with:
          name: rhinelab-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
